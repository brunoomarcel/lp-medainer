name: Deploy LP Medainer


on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lp-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate required secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Missing secret FTP_HOST}"
          : "${FTP_USER:?Missing secret FTP_USER}"
          : "${FTP_PASSWORD:?Missing secret FTP_PASSWORD}"

      - name: Normalize deploy target
        id: target
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
        run: |
          set -euo pipefail

          RAW_TARGET="${FTP_HOST:?Missing secret FTP_HOST}"
          TARGET="$RAW_TARGET"
          PROTOCOL_FROM_HOST=""

          case "$RAW_TARGET" in
            ftps-legacy://*)
              PROTOCOL_FROM_HOST="ftps-legacy"
              TARGET="${RAW_TARGET#ftps-legacy://}"
              ;;
            ftps://*)
              PROTOCOL_FROM_HOST="ftps"
              TARGET="${RAW_TARGET#ftps://}"
              ;;
            ftp://*)
              PROTOCOL_FROM_HOST="ftp"
              TARGET="${RAW_TARGET#ftp://}"
              ;;
            *://*)
              echo "Unsupported protocol in FTP_HOST. Use ftp://, ftps:// or ftps-legacy://."
              exit 1
              ;;
          esac

          case "$TARGET" in
            *@*) TARGET="${TARGET#*@}" ;;
          esac

          HOST_PORT="$TARGET"
          PATH_FROM_HOST=""
          case "$TARGET" in
            */*)
              HOST_PORT="${TARGET%%/*}"
              PATH_FROM_HOST="${TARGET#*/}"
              ;;
          esac

          HOST="$HOST_PORT"
          PORT_FROM_HOST=""
          case "$HOST_PORT" in
            *:*)
              HOST="${HOST_PORT%%:*}"
              PORT_FROM_HOST="${HOST_PORT##*:}"
              ;;
          esac

          if [ -z "$HOST" ]; then
            echo "Could not determine FTP host from FTP_HOST"
            exit 1
          fi

          if [ -n "${FTP_PROTOCOL:-}" ]; then
            PROTOCOL="$FTP_PROTOCOL"
          elif [ -n "$PROTOCOL_FROM_HOST" ]; then
            PROTOCOL="$PROTOCOL_FROM_HOST"
          elif [ -n "$PORT_FROM_HOST" ] && [ "$PORT_FROM_HOST" = "990" ]; then
            PROTOCOL="ftps-legacy"
          else
            PROTOCOL="ftp"
          fi

          case "$PROTOCOL" in
            ftp|ftps|ftps-legacy) ;;
            *)
              echo "Unsupported FTP_PROTOCOL '$PROTOCOL'. Use ftp, ftps or ftps-legacy."
              exit 1
              ;;
          esac

          if [ -n "${FTP_PORT:-}" ]; then
            PORT="$FTP_PORT"
          elif [ -n "$PORT_FROM_HOST" ]; then
            PORT="$PORT_FROM_HOST"
          elif [ "$PROTOCOL" = "ftps-legacy" ]; then
            PORT="990"
          else
            PORT="21"
          fi

          if [ "$PORT" = "990" ] && [ "$PROTOCOL" = "ftp" ]; then
            echo "Porta 990 normalmente exige FTPS implicito."
            echo "Ajuste FTP_PROTOCOL para ftps-legacy ou use uma porta/protocolo compatível."
            exit 1
          fi

          REMOTE_PATH="${FTP_PATH:-}"
          if [ -z "$REMOTE_PATH" ] && [ -n "$PATH_FROM_HOST" ]; then
            REMOTE_PATH="$PATH_FROM_HOST"
          fi
          if [ -z "$REMOTE_PATH" ]; then
            REMOTE_PATH="public_html"
          fi
          REMOTE_PATH="${REMOTE_PATH%/}/"

          echo "Deploy target: host=$HOST protocol=$PROTOCOL port=$PORT path=$REMOTE_PATH"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "protocol=$PROTOCOL" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "remote_path=$REMOTE_PATH" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.target.outputs.host }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ steps.target.outputs.port }}
          protocol: ${{ steps.target.outputs.protocol }}
          local-dir: dist/
          server-dir: ${{ steps.target.outputs.remote_path }}
          timeout: 120000
          log-level: verbose
